; Configuracion del NourishBot local (Ollama).
; Cambiar de perfil de GPU o de modelo NO requiere tocar el codigo, solo este archivo.

[ollama]
; Servidor Ollama local, compatible con el protocolo de chat de OpenAI en /v1,
; y con su propia API nativa en /api (usada aqui para las llamadas de vision).
#base_url = http://localhost:11434
base_url = http://convergenciax02:11434

; Timeout en segundos para llamadas a Ollama (aumentar si es remoto y lento)
timeout = 180

; keep_alive: cuánto tiempo mantener modelo cargado en VRAM después del uso
; (ahorra tiempo de reload si las siguientes queries vienen dentro de este período)
keep_alive = 10m

; --- Modelo de VISION (analiza la imagen y describe/lista ingredientes) ---
; RTX 3050 Ti (6 GB VRAM): usar un modelo de vision liviano. Descargar con:
;   ollama pull llava:7b
;   ollama pull moondream  (alternativa más rápida, ~5s vs 15s)
#vision_model = llava:7b
vision_model = llama3.2-vision

; --- Modelo de TEXTO/razonamiento (agentes de filtrado, nutricion, recetas) ---
; Ya lo tienes descargado (4.7 GB) - buen seguimiento de instrucciones/JSON.
#text_model = qwen2.5:7b-instruct-q4_K_M
text_model = qwen3:32b

; Parámetros de inferencia INDEPENDIENTES por modelo
; temperature: 0.0=determinístico, 1.0=creativo. Rango típico: 0.0-0.8
;  Vision: más bajo = menos alucinaciones en descripción de imagen
;  Text: más bajo = recetas/análisis más consistentes
temperature_vision = 0.1

temperature_text = 0.3

; top_p: nucleus sampling, controla diversidad de tokens
; 0.1 = respuestas muy focalizadas, 1.0 = todas opciones consideradas
top_p = 0.9

; num_predict: número máximo de tokens a generar (-1 = ilimitado)
; Bajar esto acelera inferencia (menos tokens = menos tiempo)
num_predict = 500

; Nota GPU 6GB: Ollama por defecto mantiene UN modelo cargado en VRAM a la vez
; y descarga/recarga al cambiar de modelo (segundos extra por cambio, no error).
; Si el intercambio vision<->texto se siente lento, iguala ambos valores a
; "llava:7b" para que el crew completo use un solo modelo y no haya swaps.

; --- Perfil alternativo para GPU grande (RTX A4500, 16 GB VRAM) ---
; Descomentar y usar estos valores en su lugar (ver MANUAL.md, tabla de modelos):
; vision_model = qwen2.5vl:7b
; text_model = qwen2.5:14b-instruct-q4_K_M
; temperature_vision = 0.1
; temperature_text = 0.2

[datos]
; Carpeta donde la app Gradio guarda temporalmente la imagen subida por el usuario.
uploaded_image_path = uploaded_image.jpg

[logging]
; Nivel de log: DEBUG (muy verbose), INFO (hitos), WARNING (problemas), ERROR (críticos)
level = DEBUG

; Directorio donde guardar logs
; (si no existe, se crea automáticamente)
log_dir = logs

; Nombre del archivo log principal (se crea en log_dir/)
log_file = nourish_bot.log

; Nombre del archivo de benchmark (registro de tiempos de cada ejecución)
benchmark_file = benchmark.log

; Máximo tamaño del log antes de rotar (en MB)
log_max_size_mb = 10

; Número de archivos log rotados a mantener
log_backup_count = 5

[benchmark]
; Habilitar benchmarking (registra tiempo de cada operación)
enabled = true

; Si true, también registra parámetros de configuración en cada ejecución
log_config = true

; Si true, registra JSON estruturado (para análisis posterior)
json_format = true
