# ═══════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN — IA Agente - Tools y Math
# ═══════════════════════════════════════════════════════════════════════════
# Proyecto: LangChain Tool Calling + Ollama local
# Propósito: Operaciones matemáticas + búsqueda Wikipedia con herramientas
# Lenguaje: Español (100%)
# ═══════════════════════════════════════════════════════════════════════════
 
[infrastructure]
# Disponibilidad de Ollama local
ollama_available = true
equipment = laptop

[ollama]
# Conexión y configuración del LLM local
base_url = http://localhost:11434
model_name = llama3.1:8b-instruct-q2_K
#model_name = qwen2.5:7b

temperature = 0.0
max_tokens = 1024
request_timeout = 360
# num_ctx = 8192 se aplica en el código Python (ChatOllama) para evitar truncamiento
# keep_alive = "30m" se aplica en ChatOllama para evitar recargar modelo entre consultas

[project]
# Metadata del proyecto
name = IA Agente - Tools y Math
version = 1.0
language = es
author = ConvergenciaX/@joel.cotrado@gmail.com
description = Asistente matemático con herramientas personalizadas y búsqueda contextual

[logging]
# Configuración de logs
log_dir = logs
log_level = INFO
log_format = detailed
max_log_size = 10
backup_count = 5

[output]
# Almacenamiento de resultados
output_dir = outputs
save_results = true
save_format = txt

[execution]
# Control de ejecución
verbose = true
show_agent_thoughts = true

[serper]
# Configuración de Serper (Búsqueda Web)
# Obtén API key en: https://serper.dev
# Deja en blanco si no tienes API key
api_key =

[benchmark]
# Configuración de benchmarking
enabled = true
variant_label =