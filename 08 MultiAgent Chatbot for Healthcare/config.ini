# ═══════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN — MultiAgent Chatbot for Healthcare (AutoGen/AG2)
# ═══════════════════════════════════════════════════════════════════════════
# Proyecto: Sistema multiagente de IA para consulta médica experta
# Propósito: Simular equipo médico colaborativo mediante agentes especializados
# Framework: AutoGen (AG2) con Ollama local para inferencia
# Lenguaje: Español (100%)
# ═══════════════════════════════════════════════════════════════════════════

[infrastructure]
# Disponibilidad de infraestructura local
ollama_available = true
equipment = laptop

[ollama]
# Conexión y configuración del LLM local
base_url = http://localhost:11434
#base_url = http://convergenciax02:11434
# Modelo principal para agentes generalists (análisis, coordinación)
model_name = qwen2.5:7b
#model_name = deepseek-v2:16b
#model_name = gemma4:26b
#model_name = qwen3-coder:30b
#model_name = llama3.1:70b
# Alternativa para tareas de conocimiento profundo (medical info)
# model_medical = llama3.1:8b-instruct-q2_K

temperature = 0.3
max_tokens = 2000
num_ctx = 8192
request_timeout = 180
keep_alive = 30m

[autogen]
# Configuración de AutoGen (AG2)
max_consecutive_auto_reply = 10
max_retries_for_llm = 3
max_turns = 12
timeout_retries = 5

# Agentes a crear (especificar con | separador)
agents = medical_info_agent|symptom_analyzer|treatment_suggester|safety_validator|user_interface

[project]
# Metadata del proyecto
name = MultiAgent Chatbot for Healthcare
version = 1.0
language = es
author = ConvergenciaX/@joel.cotrado@gmail.com
description = Sistema multiagente de IA para consulta médica experta con AutoGen

[logging]
# Configuración de logs
log_dir = logs
log_level = INFO
log_format = detailed
max_log_size = 10
backup_count = 5

[output]
# Almacenamiento de resultados
output_dir = outputs
save_results = true
save_format = txt

[execution]
# Control de ejecución
verbose = true
show_agent_thoughts = true
streaming_output = false

[benchmark]
# Control de benchmarking (rendimiento: velocidad, tokens)
enabled = true
variant_label =          # vacío = autogenera como {modelo}_t{temperatura}_agents{n}

[evaluacion]
# Control de evaluación (efectividad: exactitud, utilidad médica)
modo = hibrida           # automatica, manual, hibrida
umbral_muestreo = 0.5    # Revisar manualmente casos límite (0.4-0.6 de score)
evaluador = medico       # Para modo manual: ej "dr.gomez", para automático: "sistema"
# Verdades esperadas para evaluación automática (síntomas → diagnóstico esperado)
verdades_archivo = data/verdades_medicas.jsonl
# Métricas de seguridad: detectar hallucinations médicos
validar_seguridad = true
max_hallucination_score = 0.1  # Máximo % de alucinaciones permitido

[seguridad_medica]
# Advertencias legales y limitaciones
disclaimer = true
require_professional_confirmation = true
max_confidence_medical = 0.85   # Máximo nivel de confianza antes de pedir confirmación médica
log_all_interactions = true     # Auditoria completa para compliance

[database]
# Almacenamiento de historial de pacientes (opcional, futuro)
tipo = json               # json, sqlite, postgresql
ruta_local = data/patient_history.jsonl

# ═══════════════════════════════════════════════════════════════════════════
# NOTAS IMPORTANTES
# ═══════════════════════════════════════════════════════════════════════════
#
# 1. OLLAMA LOCAL REQUERIDO
#    - Descargar e instalar Ollama desde https://ollama.ai
#    - Ejecutar: ollama serve (en otra terminal)
#    - Descargar modelo: ollama pull qwen2.5:7b
#    - Opcional: ollama pull llama3.1:8b-instruct-q2_K (para medical info)
#
# 2. AUTOGEN/AG2 REQUERIDO
#    - Instalar con: pip install pyautogen
#    - Versión mínima: 0.2.0
#
# 3. AMBIENTE PYTHON
#    - Usar env-llm-314 (Python 3.14)
#    - Si AutoGen falla, usar env-llm-ia (Python 3.13)
#
# 4. EJECUCIÓN
#    - Script principal: python main.py
#    - O notebook: jupyter notebook automed_chatbot.ipynb
#
# 5. BENCHMARKING + EVALUACIÓN
#    - outputs/benchmark.jsonl: Métricas de rendimiento (latencia, tokens)
#    - outputs/evaluaciones.jsonl: Evaluación de precisión médica
#    - Ejecutar análisis: python analyze_benchmark.py --metric comparacion
#
# 6. SEGURIDAD MÉDICA (CRÍTICO)
#    - Este sistema NO es sustituto de consulta médica real
#    - Siempre pedir confirmación profesional para diagnósticos
#    - Registrar todas las interacciones para auditoria y compliance
#
# ═══════════════════════════════════════════════════════════════════════════
