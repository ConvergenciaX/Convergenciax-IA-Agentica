# ═══════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN — Reasoning and Acting AI Agents (LangGraph + ReAct)
# ═══════════════════════════════════════════════════════════════════════════
# Proyecto: Agente ReAct multi-herramienta con trazabilidad de reasoning
# Propósito: Demostrar patrón ReAct (Reasoning + Acting) con visibilidad completa
# Framework: LangChain + LangGraph (State + Reducers)
# Lenguaje: Español (100%)
# ═══════════════════════════════════════════════════════════════════════════

[infrastructure]
# Disponibilidad de infraestructura local
ollama_available = true
equipment = laptop

[ollama]
# Conexión y configuración del LLM local
#base_url = http://convergenciax02:11434
base_url = http://localhost:11434
# Modelo principal para agente ReAct
model_name = qwen2.5:7b
#model_name = mistral:7b
# Parámetros de inferencia
temperature = 0.3
max_tokens = 2000
num_ctx = 8192
request_timeout = 180
keep_alive = 30m

[agente]
# Configuración del agente ReAct (LangGraph)

# Mostrar trace Thought/Action/Observation
verbose = True
# Capturar pasos intermedios    
return_intermediate_steps = True
# Máximo de ciclos ReAct (evita loops infinitos)
max_iterations = 10

[project]
# Metadata del proyecto
name = Reasoning and Acting AI Agents
version = 1.0
language = es
author = ConvergenciaX/@joel.cotrado@gmail.com
description = Agente ReAct multi-herramienta con trazabilidad de reasoning usando LangGraph

[logging]
# Configuración de logs
log_dir = logs
log_level = INFO
log_format = detailed
max_log_size = 10
backup_count = 5

[output]
# Almacenamiento de resultados
output_dir = outputs
save_results = true
save_format = txt

[execution]
# Control de ejecución
verbose = true
show_reasoning_trace = true
streaming_output = false

[benchmark]
# Control de benchmarking (rendimiento: velocidad, tokens, pasos ReAct)
enabled = true
# vacío = autogenera como {modelo}_t{temperatura}_react
variant_label = 

[evaluacion]
# Control de evaluación (efectividad: exactitud, pasos necesarios)
# automatica, manual, hibrida
modo = hibrida
# Revisar manualmente casos límite
umbral_muestreo = 0.5    
# Para modo manual: evaluador humano
evaluador = sistema      
# Verdades esperadas para evaluación automática
verdades_archivo = data/verdades_esperadas.jsonl
# Validación de razonamiento
validar_reasoning = true
# Máximo de pasos ReAct esperado
max_steps_esperado = 5   

# ═══════════════════════════════════════════════════════════════════════════
# NOTAS IMPORTANTES
# ═══════════════════════════════════════════════════════════════════════════
#
# 1. LANGGRAPH + REDUCERS (Diferenciador vs LangChain puro)
#    - State con Reducers (operator.add) acumula reasoning steps
#    - Cada Thought/Action/Observation se agrega automáticamente
#    - Patrón: reasoning_steps: Annotated[list, operator.add]
#
# 2. HERRAMIENTAS DEL AGENTE (4 tools heterogéneas)
#    - Calculadora (operaciones aritméticas)
#    - Wikipedia (búsqueda de conocimiento)
#    - Fecha/Hora (información temporal)
#    - Conversor de unidades (temperatura, distancia, peso)
#
# 3. BENCHMARKING OBLIGATORIO
#    - benchmark.py: captura latencia, tokens, número de pasos ReAct
#    - analyze_benchmark.py: análisis post-hoc con reportes
#    - NUNCA código inline en notebook — reutilizable entre proyectos
#
# 4. TRAZABILIDAD DE REASONING (Corazón del proyecto)
#    - reasoning_steps: Annotated[list, operator.add] — cada paso se acumula
#    - observations: Lista de observaciones en orden
#    - Visible en: state["reasoning_steps"] después de ejecutar agente
#
# 5. AMBIENTE PYTHON (ACTUALIZADO 2026-09-20)
#    - PRIMARY: env-llm-ia (Python 3.13) con LangChain 1.4.2, LangGraph 1.2.11
#    - NOTA: El notebook fue adaptado a LangChain 1.x API tras detectar
#      incompatibilidades de import con versiones 0.1.x antiguas
#    - ALTERNATIVA NO PROBADA: env-llm-314 (Python 3.14) requeriría re-verificar imports
#

# ═══════════════════════════════════════════════════════════════════════════
