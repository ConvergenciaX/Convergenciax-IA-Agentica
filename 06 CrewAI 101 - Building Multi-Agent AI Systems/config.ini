# ---------------------------------------------------------------------------
# CREWAI 101 - CONFIGURACIÓN CENTRALIZADA
# ---------------------------------------------------------------------------
 
[infrastructure]
# Infraestructura disponible
#python_env = C:\workspace-vc\env-llm-314
ollama_available = true
serper_available = true
# Equipamiento: laptop (RTX 3050 + i5) | desktop (RTX A4500 + i7)
equipment = laptop

[ollama]
# Configuración de Ollama Local
#base_url = http://localhost:11434
base_url = http://convergenciax02:11434
# Modelos recomendados: qwen2.5:7b (rápido), llama2 (equilibrado), neural-chat (conversacional)
#model_name = qwen2.5:7b
#model_name = llama3.1:8b-instruct-q2_K
# model_name = llama3.1:8b-instruct-q4_K_M
model_name = gemma4:26b
temperature = 0.7
max_tokens = 20000
request_timeout = 180

[serper]
# Configuración de SerperDevTool (Búsqueda Web)
# Obtén API key en: https://serper.dev
# Deja en blanco si no tienes API key

#api_key =

[project]
# Configuración del proyecto
name = CrewAI - Básicos MultiAgente
version = 1.0
language = es
author = ConvergenciaX/@joel.cotrado@gmail.com

[logging]
# Configuración de logging
log_dir = logs
log_level = DEBUG
# Formatos disponibles: simple, detailed, json
log_format = detailed
# Rotación de logs (en MB)
max_log_size = 10
backup_count = 5

[output]
# Configuración de salida
output_dir = outputs
save_results = true
save_format = txt
# Opciones: console, file, both
output_mode = both

[execution]
# Configuración de ejecución
verbose = true
show_prompts = false
show_agent_thoughts = true
# Modo de crew: sequential, hierarchical
crew_mode = sequential
