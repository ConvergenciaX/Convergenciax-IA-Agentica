; DocChat RAG — Configuración local (Ollama + Chroma Docker)
; Cambiar parámetros aquí NO requiere tocar el código.

[ollama]
; Endpoint OpenAI-compatible de Ollama (para chat de LLMs)
base_url = http://localhost:11434
#base_url = http://convergenciax02:11434

; Timeout en segundos para llamadas a Ollama (aumentar si es remoto y lento)
timeout = 60

; keep_alive: cuánto tiempo mantener modelo cargado en VRAM después del uso
keep_alive = 10m

; --- Modelo de TEXTO/razonamiento (3 agentes usan este mismo modelo) ---
; Para 6 GB VRAM (RTX 3050): qwen2.5:7b-instruct-q4_K_M (4.7 GB) recomendado
; Para 16 GB VRAM (RTX A4500): qwen2.5:14b-instruct-q4_K_M o mayor
#text_model = qwen2.3:7b-instruct-q4_K_M
text_model = qwen2.5:7b-instruct-q4_K_M

; Parámetros de inferencia para los 3 agentes
; temperature: 0.0=determinístico (recomendado para verificación), 1.0=creativo
temperature = 0.1

; top_p: nucleus sampling, controla diversidad de tokens (0.1-1.0)
top_p = 0.9

; num_predict: máximo de tokens a generar (-1 = ilimitado, bajar para acelerar)
num_predict = 300

[embeddings]
; Modelo de embeddings local (vía Ollama embedding endpoint)
; mxbai-embed-large: 670 MB, buena calidad (recomendado)
; nomic-embed-text: 274 MB, más rápido pero menos preciso
embedding_model = mxbai-embed-large
#embedding_model = nomic-embed-tex

[chroma]
; Vector store remoto (Docker)
; Si Chroma corre en localhost:8000 (puerto por defecto):
#host = localhost
#port = 8000
; Si es remoto:
host = localhost
port = 8000

; Nombre de la colección Chroma donde guardar documentos
collection_name = rag_agentai_documents

[rag]
; Parámetros del pipeline de recuperación
; Número de documentos a recuperar por búsqueda vectorial (Chroma)
;vector_search_k = 10
vector_search_k = 10

; Pesos del EnsembleRetriever (BM25 + vector)
; Formato: "bm25_weight,vector_weight" (deben sumar 1.0)
ensemble_weights = 0.4,0.6

; Máximo número de documentos a pasar al LLM de razonamiento
max_context_docs = 5

[gradio]
; Servidor Gradio
server_name = 127.0.0.1
server_port = 5020
share = false

[document_processor]
; Configuración de Docling (parsing) + OCR (EasyOCR)
; Ver: scripts/download_local_models.py para descargar modelos una vez

; Ruta local con modelos pre-descargados de Docling (layout, tablas, detectores)
; Ejecuta: python scripts/download_local_models.py (una sola vez, con internet)
; Después, la app corre 100% offline sin contactar HuggingFace
docling_artifacts_path = ./models/docling

; Habilitar OCR (reconocer texto en imágenes dentro de PDFs)
; = true: detecta y extrae texto de gráficos, tablas, etc. (más lento, requiere GPU)
; = false: solo extrae texto de PDFs "textuales" (rápido, sin GPU)
; Para mayoría de PDFs de textos, dejar en true; cambiar a false si no hay imágenes
do_ocr = true
#do_ocr = false

; Ruta local con modelos pre-descargados de EasyOCR
; Los modelos se pre-cachean la PRIMERA VEZ que procesas un PDF con imágenes
; Ver: SETUP.md → "Paso 2.5" para detalles
docling_ocr_models_path = ./models/easyocr

[logging]
; Nivel de log: DEBUG (verbose), INFO (hitos), WARNING, ERROR
level = DEBUG

; Directorio de logs (se crea automáticamente si no existe)
log_dir = logs

; Nombre del archivo log principal
log_file = rag_agentai.log

; Máximo tamaño del log antes de rotar (MB)
log_max_size_mb = 10

; Número de archivos log rotados a mantener
log_backup_count = 5
