[ollama]
; Servidor Ollama local, compatible con la API de OpenAI en /v1
base_url = http://localhost:11434/v1
; Modelo por defecto: ya lo tienes descargado (4.7 GB, cabe holgado en 6 GB VRAM)
modelo = qwen2.5:7b-instruct-q4_K_M
temperature = 0.1

[datos]
csv_path = customer_support_tickets.csv
max_tickets_al_llm = 10

[logging]
level = DEBUG
