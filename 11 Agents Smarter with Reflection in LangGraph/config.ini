#  
# CONFIGURACIÓN — Agents Smarter with Reflection in LangGraph
#  
# Generador de publicaciones de LinkedIn optimizadas con reflexión deliberada
# Patrón: Generate → Reflect → Revise (Pensamiento "Sistema 2") 
# Framework: LangChain + LangGraph (StateGraph + Reflection Loop)

[infrastructure]
ollama_available = true
equipment = laptop

[ollama]
# Conexión y configuración del LLM local
base_url = http://localhost:11434
# Modelo principal para agente con reflexión
#model_name = qwen2.5:7b
model_name = mistral:7b
# Parámetros de inferencia
temperature = 0.3
max_tokens = 2000
num_ctx = 8192
request_timeout = 180
keep_alive = 30m

[agente]
# Configuración del agente con reflexión

# Mostrar trace completo (generate → reflect → revise)
verbose = true 
# Máximo de ciclos de reflexión (evita loops infinitos)
max_reflection_cycles = 8
# Umbral de calidad para aceptar respuesta (0.0-1.0)
quality_threshold = 0.7

[reflection_criteria]
# Criterios evaluados durante reflexión

# ¿Es clara la respuesta?
check_clarity = true
# ¿Es precisa?
check_accuracy = true
# ¿Es atractiva/interesante?
check_engagement = true
# ¿Está completa?
check_completeness = true
# ¿Tono apropiado?
check_tone = true

[project]
# Metadata del proyecto
name = Agentes Inteligentes con Reflexión en LangGraph
version = 1.0
language = es
author = ConvergenciaX/@joel.cotrado@gmail.com
description = Agente que implementa pensamiento Sistema 2: genera, refleja y revisa iterativamente

[logging]
# Configuración de logs
log_dir = logs
log_level = INFO
log_format = detailed
max_log_size = 10
backup_count = 5

[output]
# Almacenamiento de resultados
output_dir = outputs
save_results = true
save_format = txt

[execution]
# Control de ejecución
verbose = true
show_reflection_trace = true
streaming_output = false

[benchmark]
# Control de benchmarking (iteraciones, tiempo, calidad)
enabled = true
# Etiqueta para diferenciar variantes
variant_label =

[evaluacion]
# Control de evaluación
# automatica, manual, hibrida
modo = hibrida
# Caso de uso principal: LinkedIn posts
use_case = linkedin_posts
# Verdades esperadas para evaluación
verdades_archivo = data/verdades_esperadas.jsonl
# Validación de reflexión
validar_reflexion = true

# ═══════════════════════════════════════════════════════════════════════════
# NOTAS IMPORTANTES
# ═══════════════════════════════════════════════════════════════════════════
#
# 1. PATRÓN DE REFLEXIÓN (Diferenciador vs agentes básicos)
#    - Generate: LLM crea contenido inicial
#    - Reflect: LLM evalúa su propia generación
#    - Revise: LLM mejora basándose en evaluación
#    - Repeat: Hasta calidad satisfactoria o max_reflection_cycles
#
# 2. SISTEMA 2 ARTIFICIAL
#    - Pensamiento System 1: rápido, intuitivo (generate)
#    - Pensamiento System 2: lento, deliberado (reflect + revise)
#    - Resultado: respuestas más pulidas y reflexionadas
#
# 3. CASO DE USO: LinkedIn Posts
#    - Genera posts profesionales
#    - Refleja sobre impacto, tono, engagement
#    - Revisa para máximo impacto
#    - Ejemplo real de aplicación práctica
#
# 4. MÉTRICAS DE REFLEXIÓN
#    - Ciclos necesarios para converger
#    - Mejora en puntuación de calidad por ciclo
#    - Trade-off: latencia vs calidad
#
# 5. ARQUITECTURA LANGGRAPH
#    - StateGraph con nodos: generate, reflect, revise, decide
#    - Conditional edges: ¿continuar reflexionando o terminar?
#    - Reducers: acumulan ciclos de reflexión
#
# ═══════════════════════════════════════════════════════════════════════════
